title: "Markus Hedrich"
name: "Markus Hedrich"
description: "Historiker · Globalgeschichte · Kolonialgeschichte · Medizingeschichte"

url: "https://markus-hedrich.github.io"
baseurl: "/markus-hedrich-website"

remote_theme: "mmistakes/minimal-mistakes"

minimal_mistakes_skin: "air"

locale: "de-DE"

author:
  name: "Markus Hedrich"
  bio: "Historiker · Globalgeschichte · Kolonialgeschichte · Medizingeschichte"
  location: "Hamburg"

markdown: kramdown

plugins:
  - jekyll-include-cache

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false

collections:
  pages:
    output: true
    permalink: /:path/
sass:
  style: compressed
    
